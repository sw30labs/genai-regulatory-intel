# ============================================================================
# RegIntel — Jurisdiction Profiles (GenAI / Agentic AI Governance)
# ============================================================================
#
# This file defines all jurisdictions the system tracks for GenAI governance
# in Tier 1 banks. Each profile includes regulatory bodies, known regulations,
# and search terms focused on generative AI governance requirements.
#
# HOW TO ADD A NEW JURISDICTION:
#   1. Add a new entry under the appropriate priority section
#   2. Set a unique `id` (lowercase, underscores for spaces)
#   3. Set `region` to one of: eu, apac, americas, mea, global
#   4. Add at least one regulatory_body with name + acronym + url
#   5. List known regulations in key_regulations (the Research Agent
#      uses these to avoid rediscovering what's already known)
#   6. Add 2-5 search_terms — these become fallback web search queries
#   7. Run: regitel db seed && regitel research -j <your_id>
#
# PRIORITY LEVELS:
#   1 = Critical — scanned every run (default for --full)
#   3 = Important — scanned weekly or on demand
#   5 = Monitoring — scanned monthly or on demand
#   6 = Low — scanned on demand only
#   7 = Minimal — rarely changes, scan occasionally
#
# ============================================================================


# ============================================================================
# PRIORITY 1 — Critical jurisdictions, scanned every run
# ============================================================================

- id: eu
  name: European Union
  region: eu
  priority: 1
  regulatory_bodies:
    - name: European Banking Authority
      acronym: EBA
      url: https://www.eba.europa.eu
    - name: European Central Bank
      acronym: ECB
      url: https://www.ecb.europa.eu
    - name: European Commission
      acronym: EC
      url: https://commission.europa.eu
  key_regulations:
    - "EU AI Act (Art. 5, Art. 50, Annex III)"
    - "GDPR Art. 22 (automated decision-making)"
    - "DORA (Digital Operational Resilience Act) — FM providers as ICT third parties"
    - "EBA Guidelines on ICT and Security Risk Management"
    - "CRD IV / EBA internal governance frameworks"
    - "ECB SREP & internal-models guidance"
  search_terms:
    - "EU AI Act high-risk financial services credit scoring Annex III"
    - "GDPR automated decision-making credit scoring SCHUFA CJEU"
    - "DORA foundation model providers ICT third party critical CTPP"
    - "EBA AI Act implications banking sector 2025 2026"
    - "EU AI Act Article 50 transparency chatbots GenAI banking"
    - "ECB AI model risk management SREP"
    - "Digital Omnibus Act AI Act delay"

