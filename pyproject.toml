[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regitel"
version = "0.1.0"
description = "Penetration Testing Regulatory Intelligence System"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # LLM & Agents
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-community==0.4.2",
    "openai==3.45.0",

    # Storage
    "sqlalchemy==2.1.8",
    "chromadb==1.5.9",
    "sentence-transformers==6.2.0",

    # Document Processing
    "pymupdf==2.1",
    "pdfplumber==0.11.10",
    "langchain-text-splitters==1.1.3",

    # CLI
    "click==8.5.0",
    "rich==15.0.0",

    # Data
    "pydantic==2.14.2",

    # Utilities
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.3",
]

[project.scripts]
regitel = "regitel.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
