[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regitel"
version = "0.1.0"
description = "Penetration Testing Regulatory Intelligence System"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # LLM & Agents
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "openai>=1.109",

    # Storage
    "sqlalchemy>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",

    # Document Processing
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "langchain-text-splitters>=0.3",

    # CLI
    "click>=8.1",
    "rich>=13.0",

    # Data
    "pydantic>=2.0",

    # Utilities
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
regitel = "regitel.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
